<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>コロガールの転がる大冒険</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen 3D course; HUD chips + progress ribbon on top, thumb controls at the bottom, cards float over the scene. Single committed look: pastel toy world (sky gradient is swapped per stage). */
:root {
  --ink: #2b3a67;
  --ink-soft: #6d7aa3;
  --pink: #ff8fb1;
  --pink-deep: #f0628e;
  --mint: #4fc3f7;
  --mint-deep: #239bd3;
  --lemon: #ffd54f;
  --cream: #fff8e1;
  --blue-line: #1e6fd9;
  --lav: #d9ccff;
  --font-display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, #bfe6ff 0%, #e6dcff 42%, #ffe1ef 72%, #fff3f8 100%);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .6s;
}
#app { position: relative; height: 100%; overflow: hidden; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.hud-row { display: flex; align-items: center; gap: 8px; }
.hud-row .spacer { flex: 1; }
.chip {
  background: rgba(255, 250, 245, .88);
  border: 2px solid #fff;
  border-radius: 999px;
  padding: 5px 12px;
  font: 800 15px/1.2 var(--font-body);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 0 rgba(233, 103, 159, .18);
  white-space: nowrap;
}
.chip.star { color: #d39a00; }
.chip.boss { background: rgba(58, 53, 80, .9); color: #fff; border-color: #ffd1dc; font-size: 13px; }
.chip.boss b { color: #ff7a93; letter-spacing: 1px; }
.chip.boss i { color: rgba(255,255,255,.3); font-style: normal; letter-spacing: 1px; }
.chip.item { background: var(--lemon); color: #8a5a00; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu-btn {
  pointer-events: auto;
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--cream); border: 2px solid #fff; color: var(--ink);
  box-shadow: 0 3px 0 rgba(154, 131, 171, .35);
  cursor: pointer; padding: 0;
}
.menu-btn svg { width: 16px; height: 16px; }
.prog { position: relative; height: 16px; border-radius: 999px; background: rgba(255, 250, 245, .7); border: 2px solid #fff; }
.prog-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 999px;
  background: linear-gradient(90deg, var(--pink), #ffc38f, var(--lemon), var(--mint), #9fd4ff, var(--lav)); }
.prog-ball { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; left: 0%;
  border-radius: 50%; background: var(--cream); border: 3px solid var(--pink-deep); }
.prog-flag { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 400 10px/1 var(--font-display); color: var(--pink-deep); }

.controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.controls .left { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: auto; }
.btn {
  font: 800 14px/1 var(--font-body);
  color: var(--ink);
  background: var(--cream);
  border: 2px solid #fff;
  border-radius: 999px;
  padding: 11px 15px;
  box-shadow: 0 4px 0 rgba(154, 131, 171, .35);
  cursor: pointer;
  touch-action: manipulation;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(154, 131, 171, .35); }
.btn:disabled { opacity: .55; }
.btn:focus-visible, .jump:focus-visible, .menu-btn:focus-visible, .seg button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
.btn.primary { background: var(--pink); color: #fff; border-color: #ffd0e4; box-shadow: 0 4px 0 var(--pink-deep); }
.btn.mint { background: var(--mint); color: #fff; border-color: #c9ecfc; box-shadow: 0 4px 0 var(--mint-deep); text-shadow: 0 1px 0 rgba(30,111,217,.35); }
.btn.wide { width: 100%; padding: 14px; font-size: 16px; }
.mode { font: 800 12px/1 var(--font-body); color: var(--ink-soft); background: rgba(255,250,245,.7); padding: 6px 10px; border-radius: 999px; }
.jump {
  pointer-events: auto;
  width: 92px; height: 92px; border-radius: 50%;
  font: 400 16px/1 var(--font-display); white-space: nowrap; padding: 0;
  background: radial-gradient(circle at 35% 30%, #ffd1e5, var(--pink) 60%);
  color: #fff; text-shadow: 0 2px 0 var(--pink-deep);
  border: 4px solid #fff;
  box-shadow: 0 6px 0 var(--pink-deep), 0 10px 18px rgba(233, 103, 159, .3);
  touch-action: none; cursor: pointer;
}
.jump:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-deep); }

#joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.85); background: rgba(255,255,255,.18); pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  background: var(--pink); border: 3px solid #fff; }

.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.overlay.center { justify-content: center; background: rgba(255, 240, 248, .5); }
.card {
  width: min(380px, 100%);
  background: rgba(255, 248, 225, .96);
  border: 3px solid #fff;
  border-radius: 28px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  text-align: center;
  box-shadow: 0 8px 0 rgba(79, 195, 247, .28), 0 18px 40px rgba(43, 58, 103, .18);
}
.logo { font: 400 28px/1.15 var(--font-display); color: var(--pink-deep); letter-spacing: .02em; text-wrap: balance;
  text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(233,103,159,.2); }
.logo span { color: #f2a93b; }
.brand { width: min(360px, 94vw, 50vh); margin: max(4px, env(safe-area-inset-top, 0px)) auto auto; flex: none; }
.brand svg { display: block; width: 100%; height: auto; overflow: visible; }
.brand text { font-family: var(--font-display); }
@media (max-height: 720px) {
  #titleOv .card { gap: 7px; padding: 12px; }
  #titleOv .btn { padding-top: 10px; padding-bottom: 10px; }
}
.h2 { font: 400 22px/1.2 var(--font-display); color: var(--pink-deep); }
.sub { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-soft); text-wrap: pretty; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
label.btn { display: inline-flex; justify-content: center; align-items: center; }

.opt { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.opt-label { font: 800 11.5px/1 var(--font-body); color: var(--ink-soft); letter-spacing: .06em; padding-left: 4px; }
.seg { display: flex; background: #fff0f6; border-radius: 999px; padding: 4px; gap: 4px; }
.seg button {
  flex: 1; min-width: 0;
  font: 800 13.5px/1.25 var(--font-body); color: var(--ink-soft);
  background: transparent; border: 0; border-radius: 999px; padding: 8px 4px;
  cursor: pointer; touch-action: manipulation;
}
.seg button small { display: block; font-size: 10.5px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--pink-deep); box-shadow: 0 2px 0 rgba(233,103,159,.25); }

.stage-pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; background: #fff0f6; border: 2px solid #fff; border-radius: 20px; cursor: pointer; text-align: left; font: inherit; color: var(--ink); touch-action: manipulation; }
.stage-pick:focus-visible, .stage-card:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
.stage-swatch { width: 44px; height: 44px; border-radius: 14px; flex: none; border: 2px solid #fff; box-shadow: 0 2px 0 rgba(154, 131, 171, .3); }
.stage-text { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.stage-name { font: 400 16px/1.2 var(--font-display); color: var(--pink-deep); }
.stage-change { font: 800 13px/1 var(--font-body); color: var(--ink-soft); white-space: nowrap; }
.stage-list { display: flex; flex-direction: column; gap: 10px; }
.stage-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; border: 3px solid #fff; background: #fffaf5; cursor: pointer; text-align: left; font: inherit; color: var(--ink); box-shadow: 0 4px 0 rgba(154, 131, 171, .25); touch-action: manipulation; }
.stage-card[aria-pressed="true"] { border-color: var(--pink); background: #fff0f6; }
.stage-card .stage-swatch { width: 64px; height: 64px; }
.stage-card .no { font: 400 11px/1 var(--font-display); color: var(--ink-soft); letter-spacing: .08em; }
.stage-card .nm { font: 400 18px/1.25 var(--font-display); color: var(--pink-deep); }
.stage-card .ds { font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
.stage-card .bt { font: 800 11.5px/1.4 var(--font-body); font-variant-numeric: tabular-nums; }
.big { font: 400 46px/1 var(--font-display); color: var(--pink-deep); text-shadow: 0 4px 0 #fff; }
.result { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 6px 18px; margin: 0;
  font: 800 17px/1.3 var(--font-body); font-variant-numeric: tabular-nums; }
.result dt { color: var(--ink-soft); text-align: right; }
.result dd { margin: 0; text-align: left; }

.crop-wrap { position: relative; width: min(240px, 100%); aspect-ratio: 1; margin: 0 auto; }
#cropCanvas { width: 100%; height: 100%; display: block; border-radius: 20px; touch-action: none; cursor: grab; background: #fff0f6; }
.zoom { display: flex; align-items: center; gap: 10px; font: 800 12px/1 var(--font-body); color: var(--ink-soft); }
.zoom input { flex: 1; min-width: 0; accent-color: var(--pink-deep); }
.status { font: 800 12.5px/1.5 var(--font-body); color: var(--mint-deep); min-height: 1.5em; margin: 0; }

.toast {
  position: absolute; left: 50%; top: 96px; transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: #fff; color: var(--pink-deep);
  font: 800 14px/1.5 var(--font-body);
  padding: 9px 16px; border-radius: 999px;
  box-shadow: 0 4px 0 rgba(233, 103, 159, .2);
  pointer-events: none; text-align: center;
  transition: opacity .25s;
}
.toast.off { opacity: 0; }
#err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .toast, body { transition: none; } }
</style>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div id="err">3D表示の読み込みに失敗しました。通信環境を確認して再読み込みしてください。</div>'); return; }

const TAU = Math.PI * 2;
const R = 1;
const FRICTION = 0.9;

function drawDefaultFace(g, c, r) {
  g.fillStyle = '#fffdfa'; g.fillRect(0, 0, 512, 512);
  for (const s of [-1, 1]) {
    const ck = g.createRadialGradient(c + s * r * .5, c + r * .14, 0, c + s * r * .5, c + r * .14, r * .16);
    ck.addColorStop(0, 'rgba(255,140,165,.75)'); ck.addColorStop(1, 'rgba(255,140,165,0)');
    g.fillStyle = ck; g.beginPath(); g.ellipse(c + s * r * .5, c + r * .14, r * .17, r * .11, 0, 0, TAU); g.fill();
    const ex = c + s * r * .27, ey = c - r * .1;
    g.fillStyle = '#1c1f2e'; g.beginPath(); g.ellipse(ex, ey, r * .1, r * .15, 0, 0, TAU); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.ellipse(ex + r * .025, ey - r * .065, r * .045, r * .052, 0, 0, TAU); g.fill();
    g.beginPath(); g.arc(ex - r * .03, ey + r * .06, r * .016, 0, TAU); g.fill();
  }
  // open smile with a little tongue
  const my = c + r * .1, mw = r * .25;
  g.beginPath(); g.moveTo(c - mw, my); g.quadraticCurveTo(c, my + r * .05, c + mw, my); g.quadraticCurveTo(c + mw * .9, my + r * .4, c, my + r * .4); g.quadraticCurveTo(c - mw * .9, my + r * .4, c - mw, my); g.closePath();
  g.fillStyle = '#9c2338'; g.fill();
  g.save(); g.clip();
  g.fillStyle = '#ff7d96'; g.beginPath(); g.ellipse(c, my + r * .38, r * .16, r * .12, 0, 0, TAU); g.fill();
  g.restore();
}

// crop = { cx, cy, size } in image pixels: the square that becomes the front of the ball.
function buildFace(img, crop) {
  const g = faceCanvas.getContext('2d');
  const S = 512, c = S / 2, r = DISC * S;
  g.clearRect(0, 0, S, S);
  if (!img) { drawDefaultFace(g, c, r); faceTex.needsUpdate = true; return; }
  const k = (2 * r) / crop.size;
  g.save();
  g.beginPath(); g.arc(c, c, r, 0, TAU); g.clip();
  g.drawImage(img, c - r - (crop.cx - crop.size / 2) * k, c - r - (crop.cy - crop.size / 2) * k, img.width * k, img.height * k);
  g.restore();
  // the back of the head takes the average colour of the disc's outer ring (hair, background)
  const d = g.getImageData(0, 0, S, S).data;
  let rr = 0, gg = 0, bb = 0, n = 0;
  for (let a = 0; a < 180; a++) {
    const t = a / 180 * TAU;
    for (const q of [.88, .94]) {
      const x = Math.round(c + Math.cos(t) * r * q), y = Math.round(c + Math.sin(t) * r * q);
      const i = (y * S + x) * 4;
      if (d[i + 3] < 200) continue;
      rr += d[i]; gg += d[i + 1]; bb += d[i + 2]; n++;
    }
  }
  const bg = n ? [rr / n, gg / n, bb / n].map(Math.round) : [255, 214, 198];
  g.save();
  g.globalCompositeOperation = 'destination-over';
  g.fillStyle = `rgb(${bg.join(',')})`; g.fillRect(0, 0, S, S);
  g.restore();
  const fe = g.createRadialGradient(c, c, r * .8, c, c, r * 1.01);
  fe.addColorStop(0, `rgba(${bg.join(',')},0)`); fe.addColorStop(1, `rgba(${bg.join(',')},1)`);
  g.fillStyle = fe; g.fillRect(0, 0, S, S);
  faceTex.needsUpdate = true;
}

/* ---------- face finding ---------- */
// MediaPipe's face detector runs on the device; the photo is never uploaded. Falls back to a skin-colour estimate.
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let detectorP = null;
function getDetector() {
  if (!detectorP) {
    const load = (async () => {
      const v = await import(MP + '/vision_bundle.mjs');
      const files = await v.FilesetResolver.forVisionTasks(MP + '/wasm');
      return v.FaceDetector.createFromOptions(files, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
        runningMode: 'IMAGE', minDetectionConfidence: .45
      });
    })();
    detectorP = Promise.race([load, new Promise(r => setTimeout(() => r(null), 9000))]).catch(() => null);
  }
  return detectorP;
}
function scaledCanvas(img, max) {
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { c, k };
}
async function detectFace(img) {
  const det = await getDetector();
  if (det) {
    try {
      const { c, k } = scaledCanvas(img, 720);
      const res = det.detect(c);
      const faces = (res.detections || []).map(d => d.boundingBox).filter(Boolean);
      if (faces.length) {
        const b = faces.sort((a, b2) => b2.width * b2.height - a.width * a.height)[0];
        const cx = (b.originX + b.width / 2) / k, cy = (b.originY + b.height * .42) / k;
        return { crop: { cx, cy, size: Math.max(b.width, b.height) / k * 1.65 }, how: 'ai' };
      }
    } catch {}
  }
  const s = skinGuess(img);
  return s ? { crop: s, how: 'skin' } : null;
}
function skinGuess(img) {
  const { c, k } = scaledCanvas(img, 120);
  const w = c.width, h = c.height, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  let sx = 0, sy = 0, sw = 0;
  const pts = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
    const skin = r > 95 && g > 40 && b > 20 && (Math.max(r, g, b) - Math.min(r, g, b)) > 15 && Math.abs(r - g) > 15 && r > g && r > b;
    if (!skin) continue;
    const wt = .2 + 1 - Math.min(1, Math.hypot(x / w - .5, y / h - .45) * 1.3);   // prefer the middle of the photo
    sx += x * wt; sy += y * wt; sw += wt; pts.push([x, y, wt]);
  }
  if (pts.length < w * h * .03) return null;
  const mx = sx / sw, my = sy / sw;
  let vx = 0, vy = 0;
  for (const [x, y, wt] of pts) { vx += wt * (x - mx) ** 2; vy += wt * (y - my) ** 2; }
  const sd = Math.sqrt(Math.max(vx, vy) / sw);
  const size = Math.max(Math.min(w, h) * .35, Math.min(Math.min(w, h), sd * 3.4));
  return { cx: mx / k, cy: (my - sd * .15) / k, size: size / k };
}

{

  cropCv.addEventListener('pointerdown', (e) => {

function platformUnder(x, z) {
  for (const p of P) if (Math.abs(x - p.x) <= p.hw + .05 && Math.abs(z - p.z) <= p.hd + .05) return p;
  return null;
}
// highest surface under (x, z) that the ball can stand on from height y
function groundAt(x, z, y) {
  let best = null, bh = -1e9;
  for (const p of P) {
    if (Math.abs(x - p.x) > p.hw + .05 || Math.abs(z - p.z) > p.hd + .05) continue;
    const h = topAt(p, z);
    if (h <= y - R + .6 && h > bh) { bh = h; best = p; }
  }
  return best ? { p: best, h: bh } : null;
}

// Walls on every platform edge with no floor beyond it (all of easy mode, and the jungle trail's hedges).
function buildEdgeWalls() {
  const step = .5, out = .4;
  for (const p of P) {
    if (p.mv) continue;
    const edges = [
      { ax: p.x - p.hw, az: p.z + p.hd, dx: 0, dz: -1, L: p.hd * 2, nx: -1, nz: 0 },
      { ax: p.x + p.hw, az: p.z + p.hd, dx: 0, dz: -1, L: p.hd * 2, nx: 1, nz: 0 },
      { ax: p.x - p.hw, az: p.z + p.hd, dx: 1, dz: 0, L: p.hw * 2, nx: 0, nz: 1 },
      { ax: p.x - p.hw, az: p.z - p.hd, dx: 1, dz: 0, L: p.hw * 2, nx: 0, nz: -1 }
    ];
    for (const e of edges) {
      if ((e.nz === -1 && p.openFront) || (e.nz === 1 && p.openBack)) continue;
      const n = Math.max(1, Math.round(e.L / step)), st = e.L / n;
      let run = -1;
      const flush = (a, b) => {
        const t0 = a * st, t1 = b * st, tm = (t0 + t1) / 2, half = (t1 - t0) / 2;
        const cx = e.ax + e.dx * tm - e.nx * .15, czz = e.az + e.dz * tm - e.nz * .15;
        FENCES.push(e.dx ? { x: cx, z: czz, hw: half, hd: .15, nx: -e.nx, nz: -e.nz, p } : { x: cx, z: czz, hw: .15, hd: half, nx: -e.nx, nz: -e.nz, p });
      };
      for (let i = 0; i < n; i++) {
        const t = (i + .5) * st;
        const exposed = !platformUnder(e.ax + e.dx * t + e.nx * out, e.az + e.dz * t + e.nz * out);
        if (exposed && run < 0) run = i;
        if (!exposed && run >= 0) { flush(run, i); run = -1; }
      }
      if (run >= 0) flush(run, n);
    }
  }
}

function disposeTree(o) {
  o.traverse(c => {
    if (c.isSprite) return;
    if (c.geometry && !c.geometry.userData.shared) c.geometry.dispose();
    if (c.material && !Array.isArray(c.material) && !c.material.userData?.shared) c.material.dispose();
  });
}

const m4 = new THREE.Matrix4();
const dummy = new THREE.Object3D(); dummy.rotation.order = 'YXZ';
const tmpCol = new THREE.Color();
function instanced(geo, mat, list, cb) {
  if (!list.length) return null;
  const inst = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((q, i) => { cb(q, m4); inst.setMatrixAt(i, m4); if (q.col != null) inst.setColorAt(i, tmpCol.setHex(q.col)); });
  world.add(inst);
  return inst;
}
// instancing via a reusable Object3D: set(q, o) fills position / rotation (YXZ) / scale
function placed(geo, mat, list, set) {
  if (!list.length) return null;
  const inst = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((q, i) => {
    dummy.position.set(0, 0, 0); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1);
    set(q, dummy); dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
    if (q.col != null) inst.setColorAt(i, tmpCol.setHex(q.col));
  });
  world.add(inst);
  return inst;
}

function addRails(railMat, postMat) {
  if (!FENCES.length) return;
  const posts = [];
  FENCES.forEach((f) => {
    const len = Math.max(f.hw, f.hd) * 2, n = Math.max(1, Math.round(len / 1.6));

/* ---------- jungle course ---------- */
// The trail runs along ridges and bridges over a deep green ravine; fall off the side and you splash into the river far below.
function jumpSign(s) {
  const p = s.p;
  SIGNS.push({ x: p.x + p.hw - .7, z: s.z1 + 1.6, y: 0, side: 1 }, { x: p.x, z: s.z1 + 2.2, y: 0, arrow: true });
}
function walker(z, hw, kind = 'tiger') { TIGERS.push({ kind, x0: lastX, z, range: Math.max(1, hw - 1.8), spd: EASY ? .35 : .55, ph: rand() * TAU, y: 0, cool: -9 }); }
// flight from barrel c to its target: launch height, flight time and upward speed
function arcOf(c) {
  const sy = c.y + c.h, t = c.target, d = Math.hypot(t.x - c.bx, t.z - c.z), T = c.arcT || Math.max(.8, Math.min(1.6, d / 14));
  return { sy, T, vy: (t.y - sy + .5 * GRAV * T * T) / T };
}
function arcBananas(c, n) {
  const { sy, T, vy } = arcOf(c), t = c.target;
  for (let i = 1; i <= n; i++) { const f = i / (n + 1), tt = f * T; STARS.push({ x: c.bx + (t.x - c.bx) * f, y: sy + vy * tt - .5 * GRAV * tt * tt, z: c.z + (t.z - c.z) * f, yb: 0, abs: true }); }
}
// a gap crossed by a chain of barrels: one on the trail fires into barrels hanging over the ravine
function cannonChain(len, modes, landLen, landW, landOpts = {}) {
  const prev = P[P.length - 1];
  if (!EASY && prev) prev.openFront = true;
  const x = lastX, yb = cy, z0 = cz;
  const cs = [{ x, bx: x, z: z0 + 2.8, y: yb, h: 1.5, mode: 'auto', air: false, ph: 0, cool: -9 }];
  modes.forEach((m, i) => cs.push({ x, bx: x, z: z0 - len * (i + 1) / (modes.length + 1), y: yb + 3.2 + (i % 2) * 1.6, h: 0, mode: m, air: true, ph: 1.3 + i * 2.1, cool: -9, amp: 2.6, spd: 1.2 + i * .15 }));
  cz -= len;

  cs.forEach((c, i) => { const n = cs[i + 1]; c.next = n; c.target = n ? { x: n.bx, y: n.y, z: n.z } : { x, y: topAt(s.p, s.z0 - 4) + R, z: s.z0 - 4 }; });
  CANNONS.push(...cs);
  cs.forEach(c => arcBananas(c, 3));

    if (said.has(c.mode)) continue;
    said.add(c.mode);
    if (c.mode === 'aim') hint(c.z + 3, 'タルが前を向いたらジャンプで発射！');
    if (c.mode === 'slide') hint(c.z + 3, 'タルがまん中に来たらジャンプ！');

const SEA_WATER = -2.2;
// open water ridden on a surfboard: you move forward on your own, steer around rocks, and big waves throw you into the air
function surfZone(len, hw, waveH, rockN) {
  const prev = P[P.length - 1];
  if (prev) prev.openFront = true;
  const x0 = lastX, z0 = cz, z1 = cz - len, y = SEA_WATER + .25 + R;
  const waves = [], rocks = [];
  for (let z = z0 - 16; z > z1 + 12; z -= 15 + rand() * 7) waves.push({ z, h: waveH * (.85 + rand() * .3), len: 4.2 });
  for (let i = 0, tries = 0; i < rockN && tries < 400; tries++) {
    const z = z1 + 10 + rand() * (len - 22), x = x0 + (rand() - .5) * 2 * (hw - 1.2), r = .8 + rand() * .6;
    if (waves.some(w => Math.abs(w.z - z) < 4.5) || rocks.some(k => Math.hypot(k.x - x, k.z - z) < 5)) continue;
    if (waves.some(w => z < w.z - 7 && z > w.z - 21) && Math.abs(x - x0) < 4.2) continue;   // keep the landing spot behind a wave clear
    rocks.push({ x, z, r }); i++;
  }
  for (let z = z0 - 6; z > z1 + 6; z -= 4.5) {
    const x = x0 + Math.sin(z * .13) * (hw - 2);
    if (rocks.some(k => Math.hypot(k.x - x, k.z - z) < 2.2) || waves.some(w => Math.abs(w.z - z) < 3)) continue;
    STARS.push({ x, y, z, yb: 0, abs: true });
  }
  for (const w of waves) for (let k = 1; k <= 4; k++) { const t = k * .3, vy = surfLaunch(w.h); STARS.push({ x: x0, y: y + w.h + vy * t - .5 * GRAV * t * t, z: w.z - 10 * t, yb: 0, abs: true }); }
  SURFS.push({ x0, hw, z0, z1, y, waves, rocks, spd: 11 });
  hint(z0 - 1, EASY ? 'なみのり！ かたむけて進もう' : 'なみのり！ トゲトゲのウニをよけよう');
  cz = z1; cy = y - R;
  const s = ramp(12, 10, x0, -(y - R), { style: 'sand' });   // a beach slope back up to the trail
  s.p.openBack = true;
  return s;
}
const surfLaunch = (h) => 9 + h * 3.5;   // big waves throw you high
const surfHeight = (sz, z) => { let h = 0; for (const w of sz.waves) { const d = Math.abs(z - w.z) / w.len; if (d < 1) h += w.h * (1 - d * d) ** 2; } return h; };
const SPOUT_VY = 24;
// time and forward speed of the spout's arc from the whale's back to a landing spot on the far pier
function spoutFlight(y0, y1, z0, z1) {
  const a = .5 * GRAV, c = y1 - y0, T = (SPOUT_VY + Math.sqrt(SPOUT_VY * SPOUT_VY - 4 * a * c)) / (2 * a);
  return { T, vz: (z1 - z0) / T };
}
function surfSign(s) { SIGNS.push({ x: s.p.x + s.p.hw + .5, z: s.z1 + 2, y: 0, text: 'surf' }); }

/* surfing */
let surf = null, surfAir = false;
function enterSurf(sz) {
  surf = sz; surfAir = true; onGround = false; groundP = null; flying = false;
  ball.vy = Math.min(ball.vy, 0);
  sfx.splash();
}
function surfStep(dt, r) {
  const sz = surf, S = SPEEDS[speed], target = -sz.spd * Math.sqrt(S.max / 12);
  ball.vz += (target - ball.vz) * Math.min(1, dt * 1.6);
  ball.vx += input.x * 30 * dt; ball.vx *= Math.exp(-2.6 * dt);
  ball.vx = Math.max(-10, Math.min(10, ball.vx));
  const prevZ = ball.z;
  ball.x += ball.vx * dt; ball.z += ball.vz * dt;
  if (Math.abs(ball.x - sz.x0) > sz.hw) { ball.x = sz.x0 + Math.sign(ball.x - sz.x0) * sz.hw; ball.vx *= -.4; }
  const surfY = sz.y + surfHeight(sz, ball.z);
  if (surfAir) {
    ball.vy -= GRAV * dt; ball.y += ball.vy * dt;
    if (ball.y <= surfY) { ball.y = surfY; ball.vy = 0; surfAir = false; sfx.land(); }
  } else {
    ball.y = surfY;
    for (const w of sz.waves) if (prevZ >= w.z && ball.z < w.z) { ball.vy = surfLaunch(w.h); surfAir = true; sfx.boing(); }
  }
  for (const k of sz.rocks) {
    if (ball.y - sz.y > 1.6 || Math.hypot(ball.x - k.x, ball.z - k.z) > k.r + .85) continue;
    if (EASY) {
      if (timer - (k.cool ?? -9) < .5) continue;
      k.cool = timer; ball.vx = (ball.x >= k.x ? 1 : -1) * 9; ball.vz = target * .35; sfx.bonk();
    } else { toast('いたっ！ ウニにささった', 1600); surf = null; die(); return; }
  }
  rollBall(dt, r);
  collect(dt);
  lastGroundY = sz.y - R;

  if (!best || bd > 6) return null;
  let x = best.x + (rand() - .5) * 2 * Math.max(0, best.hw - 1.3);

}

  const sp = Math.hypot(ball.vx, ball.vz);
  if (sp > S.max) { ball.vx *= S.max / sp; ball.vz *= S.max / sp; }

  ball.x += ball.vx * dt; ball.z += ball.vz * dt;
  if (onGround && groundP && groundP.mv) ball.x += groundP.dx;

  if (EASY && ball.y > lastGroundY - .5) keepOnFloor();
  if (EASY || ball.y < 1.8) for (const f of FENCES) collideRect(f, Math.min(r, 1.2));
  for (const q of PILLARS) if (ball.y - q.y < 3.8) collideRect(q, Math.min(r, 1.2));
  // a surface higher than the ball (a cliff, or a trail edge seen from below) acts as a wall
  for (const q of P) {
    if (q.mv || Math.abs(q.z - ball.z) > q.hd + 2 || Math.abs(q.x - ball.x) > q.hw + 2) continue;
    const zc = Math.max(q.z - q.hd, Math.min(ball.z, q.z + q.hd));
    if (topAt(q, zc) > ball.y - R + .6) collideRect({ x: q.x, z: q.z, hw: q.hw, hd: q.hd, nx: 0, nz: 0 }, Math.min(r, 1.2) * .9);
  }
  for (const c of CANNONS) {
    if (c.locked) {
      const dx = ball.x - c.x, dz = ball.z - c.z, d = Math.hypot(dx, dz);
      if (d > 2.3 || d < .01 || ball.y - c.y > 3.5) continue;
      ball.x = c.x + dx / d * 2.3; ball.z = c.z + dz / d * 2.3;
      const vn = (ball.vx * dx + ball.vz * dz) / d;
      if (vn < 0) { ball.vx -= vn * dx / d * 1.5; ball.vz -= vn * dz / d * 1.5; }
      if (timer - (c.said ?? -9) > 3) { c.said = timer; toast('カギがかかってる！ まず海賊船をやっつけよう', 2000); sfx.bonk(); }
      continue;
    }
    if (c.mode === 'gun' && BOSS && BOSS.down) continue;
    if (timer - c.cool < 1) continue;
    if (Math.hypot(ball.x - c.x, ball.z - c.z) < 2.3 && Math.abs(ball.y - (c.y + c.h)) < 2) { enterCannon(c); return; }
  }
  for (const sz of SURFS) if (ball.z < sz.z0 && ball.z > sz.z1) { enterSurf(sz); return; }

  for (const b of BUMPERS) {
    b.hit = Math.max(0, b.hit - dt * 4);
    b.mesh.scale.set(1 + b.hit * .25, 1 - b.hit * .2, 1 + b.hit * .25);
    if (ball.y - b.y > 2.2) continue;
    const dx = ball.x - b.x, dz = ball.z - b.z, d = Math.hypot(dx, dz);
    if (d < r + b.r && d > 0) {
      const nx = dx / d, nz = dz / d;
      ball.x = b.x + nx * (r + b.r); ball.z = b.z + nz * (r + b.r);
      const vn = ball.vx * nx + ball.vz * nz;
      if (vn < 0) { ball.vx -= 2 * vn * nx; ball.vz -= 2 * vn * nz; }
      const s = Math.max(Math.min(11, S.max), Math.hypot(ball.vx, ball.vz));
      const s2 = Math.hypot(ball.vx, ball.vz) || 1;
      ball.vx = ball.vx / s2 * s; ball.vz = ball.vz / s2 * s;
      b.hit = 1; sfx.boing();
    }
  }
  for (const q of PENDS) {
    const pp = podPos(q, worldT);
    const dx = ball.x - pp.x, dy = ball.y - pp.y, dz = ball.z - q.z, d = Math.hypot(dx, dy, dz);
    if (d < r + 1.2 && d > 1e-4) {
      const h = Math.hypot(dx, dz) || 1, nx = dx / h, nz = dz / h, push = r + 1.2 - d;
      const swing = q.amp * q.spd * Math.cos(worldT * q.spd + q.ph) * q.len;
      ball.x += nx * push; ball.z += nz * push;
      ball.vx = nx * 6 + swing * .7; ball.vz = nz * 6 + ball.vz * .3;
      if (timer - (q.cool ?? -9) > .35) { q.cool = timer; sfx.bonk(); }
    }
  }
  for (const t of TIGERS) {
    const dx = ball.x - tigerX(t), dz = ball.z - t.z;
    if (timer - t.cool > .6 && Math.abs(dx) < 1.6 + r * .6 && Math.abs(dz) < .9 + r && Math.abs(ball.y - t.y - 1.2) < 1.8) {
      t.cool = timer;
      ball.vz = 9; ball.vx += (dx >= 0 ? 1 : -1) * 3;
      if (onGround) { ball.vy = 3.5; onGround = false; groundP = null; }
      if (t.kind === 'crab') { sfx.bonk(); toast('チョキン！', 1200); } else { sfx.roar(); toast('ガオー！', 1200); }
    }
  }
  if (NUTZONES.length) updateNuts(dt, r);

  const prevY = ball.y;
  const g = (fxState.wing > 0 && ball.vy < 0) ? GRAV * .4 : GRAV;
  ball.vy -= g * dt; ball.y += ball.vy * dt;
  const gr = groundAt(ball.x, ball.z, Math.max(ball.y, prevY));
  if (gr && ball.vy <= .5 && ball.y <= gr.h + R + (onGround ? .45 : 0) && prevY >= gr.h + R - .5) {
    if (!prevGround && ball.vy < -8) sfx.land();
    const p = gr.p;
    ball.y = gr.h + R; ball.vy = 0; onGround = true; groundP = p; coyote = COYOTE; lastGroundY = gr.h;
    if (p.k) ball.vz += p.k * GRAV * .6 * dt;   // rolling downhill speeds up
    if (!p.mv) {
      lastSafe.x = p.hw > 1.3 ? Math.max(p.x - p.hw + 1.3, Math.min(ball.x, p.x + p.hw - 1.3)) : p.x;
      lastSafe.z = p.hd > 1.3 ? Math.max(p.z - p.hd + 1.3, Math.min(ball.z, p.z + p.hd - 1.3)) : p.z;
      lastSafe.y = topAt(p, lastSafe.z);
    }
    for (const t of TRAMPS) if (Math.abs(ball.x - t.x) < t.hw && Math.abs(ball.z - t.z) < t.hd) {
      t.t = 1; sfx.boing(); onGround = false; groundP = null; coyote = 0;
      if (t.target) {   // the whale's spout: a fixed arc, so it lands on the far pier at any speed
        const pu = platformUnder(t.target.x, t.target.z), f = spoutFlight(ball.y - R, topAt(pu, t.target.z), ball.z, t.target.z);
        Object.assign(ball, { vy: SPOUT_VY, vx: (t.target.x - ball.x) / f.T, vz: f.vz }); flying = true;
        continue;
      }
      ball.vy = 16.5; ball.vz = Math.max(-6.5, Math.min(ball.vz, -3.5));   // rise before reaching the cliff, even when rolling fast
    }
    if (onGround && jumpBuf > 0) { prevGround = true; jump(); }
  } else {
    if (onGround) coyote = COYOTE;
    onGround = false; groundP = null;
    coyote = Math.max(0, coyote - dt);
  }
  jumpBuf = Math.max(0, jumpBuf - dt);
  prevGround = onGround;

  rollBall(dt, r);
  collect(dt);

  for (let i = cpIdx + 1; i < CPS.length; i++) {
    if (ball.z < CPS[i].z && onGround) {
      cpIdx = i; CPS[i].on = true; CPS[i].flags.forEach(f => f.color.setHex(0x8fe0c6));
      sfx.cp(); toast('チェックポイント！');
    }
  }
  for (const h of HINTS) if (!h.done && ball.z < h.z) { h.done = true; toast(h.msg, 2600); }

  const noFloor = !platformUnder(ball.x, ball.z);
  if (fxState.cloud && !onGround && ball.y < lastGroundY - 1.5 && (noFloor || ball.y < lastGroundY - 4)) {
    fxState.cloud = false;
    Object.assign(ball, { x: lastSafe.x, z: lastSafe.z, y: lastSafe.y + R + 2.5, vx: 0, vz: 0, vy: 4 });
    sfx.rescue(); toast('たすけ雲がたすけてくれた！');
  }
  if (ball.y < lastGroundY - 14 || (stage !== 'sky' && noFloor && ball.y < lastGroundY - 2.2)) die();

  itemTimer -= dt;
  if (itemTimer <= 0) {
    const spot = findSpot(ball.z - 18 - rand() * 10);
    if (spot) { spawnItemAt(spot.x, spot.z, undefined, undefined, spot.y); itemTimer = 14 + rand() * 10; } else itemTimer = 2;
  }
  visitorTimer -= dt;
  if (visitorTimer <= 0 && !visitor) { spawnVisitor(); visitorTimer = 40 + rand() * 20; }

  if (ball.z < goalZ && onGround) finish();
}

function finish() {
  state = 'clear';
  sfx.goal();
  const key = `fc3-best-${stage}-${level}`;
  const prev = parseFloat(store.get(key));
  const best = isNaN(prev) ? timer : Math.min(prev, timer);
  store.set(key, String(best));
  $('#resTime').textContent = fmt(timer) + (isNaN(prev) || timer < prev ? '  NEW!' : '');
  $('#resStars').textContent = `${collected} / ${STARS.length}`;
  $('#resBest').textContent = fmt(best);
  $('#resMiss').textContent = `${misses} 回`;
  const next = STAGE_ORDER[STAGE_ORDER.indexOf(stage) + 1];
  $('#btnNext').hidden = !next;
  if (next) $('#btnNext').textContent = `次のステージ「${THEMES[next].name}」へ`;
  setTimeout(() => { if (state === 'clear') { $('#clearOv').hidden = false; (next ? $('#btnNext') : $('#btnRetry')).focus(); } }, 900);
}
const fmt = (t) => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; };

/* ---------- animation ---------- */
const tmpV = new THREE.Vector3();
function dropAt(list, i) { fx.remove(list[i].g); disposeTree(list[i].g); list.splice(i, 1); }
function updateSky(dt) {
  if (state === 'play' || state === 'title') {
    flockTimer -= dt; planeTimer -= dt; bugTimer -= dt;
    if (flockTimer <= 0) { spawnFlock(); flockTimer = 7 + rand() * 6; }
    if (stage === 'sky' && planeTimer <= 0) { spawnPlane(); planeTimer = 22 + rand() * 12; }
    if (stage === 'jungle' && bugTimer <= 0 && bugs.length < 6) { spawnBug(); bugTimer = 2.5 + rand() * 2.5; }
  }
  for (let i = flocks.length - 1; i >= 0; i--) {
    const f = flocks[i];
    f.g.position.x += f.dir * f.v * dt;
    f.g.position.y += Math.sin(tAnim * 1.3 + i) * dt * .4;
    for (const b of f.birds) for (const w of b.wings) w.piv.rotation.x = -w.s * Math.sin(tAnim * 9 + b.ph) * .8;
    if (Math.abs(f.g.position.x - ball.x) > 60 || f.g.position.z > ball.z + 15) dropAt(flocks, i);
  }
  for (let i = planes.length - 1; i >= 0; i--) {
    const p = planes[i];
    p.g.position.x += p.dir * p.v * dt;
    p.puffT -= dt;
    if (p.puffT <= 0) {
      p.puffT = .09;
      const m = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8, depthWrite: false }));
      m.position.set(p.g.position.x - p.dir * 3, p.g.position.y, p.g.position.z); m.scale.setScalar(.4);
      fx.add(m); trails.push({ m, life: 3.5 });
    }
    if (Math.abs(p.g.position.x - ball.x) > 110) dropAt(planes, i);
  }
  for (let i = trails.length - 1; i >= 0; i--) {
    const t = trails[i];
    t.life -= dt;
    t.m.scale.setScalar(.4 + (3.5 - t.life) * .35);
    t.m.material.opacity = Math.max(0, t.life / 3.5) * .8;
    if (t.life <= 0) { fx.remove(t.m); t.m.material.dispose(); trails.splice(i, 1); }
  }
  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    b.life -= dt;
    b.vx += (rand() - .5) * dt * 6; b.vz += (rand() - .5) * dt * 6;
    b.vx *= .98; b.vz *= .98;
    b.g.position.x += b.vx * dt; b.g.position.z += b.vz * dt;
    b.g.position.y += Math.sin(tAnim * 3 + b.ph) * dt * .8;
    b.g.rotation.y = Math.atan2(b.vx, b.vz);
    for (const w of b.wings) w.piv.rotation.z = w.s * (.2 + Math.abs(Math.sin(tAnim * 14 + b.ph)) * .9);
    if (b.life <= 0 || b.g.position.z > ball.z + 6) dropAt(bugs, i);
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.falling) {
      it.vy -= 14 * dt; it.y += it.vy * dt;
      if (it.y <= it.base) { it.y = it.base; it.falling = false; }
    }
    it.g.position.set(it.x, it.y + (it.falling || REDUCED ? 0 : Math.sin(tAnim * 3 + i) * .18), it.z);
    it.g.userData.body.rotation.y += dt * 1.8;
    const w = it.g.userData.wings;
    if (w) for (const q of w) q.piv.rotation.z = q.s * Math.sin(tAnim * 6) * .35;
  }
  if (visitor) {
    const u = visitor;
    u.t += dt;
    if (u.lights) { u.g.rotation.y += dt * 1.5; u.lights.forEach((l, k) => l.material.color.setHSL(((tAnim * .5 + k / 8) % 1), .8, .75)); }
    if (u.monkey) u.g.rotation.z = Math.sin(tAnim * 2.5) * .25;
    if (u.bird) { u.g.rotation.y = Math.PI / 2; for (const w of u.bird.wings) w.piv.rotation.x = -w.s * Math.sin(tAnim * 8) * .8; }
    if (u.phase === 'in') {
      tmpV.set(ball.x + 2, lastGroundY + 8.5, ball.z - 12);
      u.g.position.lerp(tmpV, 1 - Math.exp(-dt * 1.6));
      if (u.t > 3.2) { u.phase = 'hover'; u.t = 0; if (u.beam) u.beam.visible = true; }
    } else if (u.phase === 'hover') {
      tmpV.set(ball.x + 2, lastGroundY + 8.5 + Math.sin(u.t * 4) * .3, ball.z - 12);
      u.g.position.lerp(tmpV, 1 - Math.exp(-dt * 3));
      if (u.beam) u.beam.material.opacity = .25 + Math.sin(u.t * 10) * .1;
      if (!u.dropped && u.t > 1.2) {
        u.dropped = true;
        if (u.gift) u.gift.visible = false;
        const spot = findSpot(u.g.position.z);
        if (spot) { spawnItemAt(spot.x, spot.z, u.g.position.y - 1.6, u.giftType, spot.y); toast(THEMES[stage].visitorMsg[1], 2600); }
      }
      if (u.t > 2.4) { u.phase = 'out'; u.t = 0; if (u.beam) u.beam.visible = false; sfx.ufo(); }
    } else {
      u.g.position.y += dt * (6 + u.t * 14);
      u.g.position.x += dt * 10;
      if (u.t > 3) { fx.remove(u.g); disposeTree(u.g); visitor = null; }
    }
  }
}

function updateJungle(dt) {
  JW.backdrop.position.set(ball.x, 62 + camY * .5, ball.z);
  JW.waterTex.offset.x += dt * .03;
  for (const q of PENDS) {
    const pp = podPos(q, worldT), py = q.y + 8.6;
    q.pod.position.set(pp.x, pp.y, q.z); q.pod.rotation.z = pp.th;
    q.vine.position.set((q.px + pp.x) / 2, (py + pp.y) / 2, q.z); q.vine.rotation.z = pp.th;
    q.cap.position.set(pp.x - Math.sin(pp.th) * 1.25, pp.y + Math.cos(pp.th) * 1.25, q.z); q.cap.rotation.z = pp.th;
  }
  for (const t of TRAMPS) {
    t.t = Math.max(0, t.t - dt * (t.spout ? 1.5 : 3));
    if (t.spout) {
      const h = 1.6 + Math.max(0, Math.sin(tAnim * 1.7)) ** 6 * 4 + t.t * 20 + Math.sin(tAnim * 9) * .2;
      t.col.scale.set(1 + t.t * .4, h, 1 + t.t * .4); t.col.position.y = h / 2; t.crown.position.y = h; t.crown.scale.setScalar(.8 + t.t * .3);
    }
    else t.mesh.scale.set(1 + t.t * .15, 1 - t.t * .6, 1 + t.t * .15);
  }
  for (const c of CANNONS) {
    c.kick = Math.max(0, c.kick - dt * 3);
    const a = cannonYaw(c);
    if (c.mode === 'slide') { c.x = slideX(c); c.mesh.position.x = c.x; c.hang.position.x = c.x; }
    c.mesh.rotation.y = c.baseYaw + a;
    if (c.mode === 'gun') { c.mesh.rotation.x = 0; c.body.position.z = c.kick * .7; }
    else { c.mesh.rotation.x = c.air ? .45 : .55; c.body.scale.setScalar(1 + c.kick * .18); }
    c.ringMat.emissive.setHex(aligned(c) ? 0x2faf55 : (cannon && cannon.c === c ? 0x5a3800 : 0));
  }
  for (const t of TIGERS) {
    if (t.kind === 'crab') {
      t.m.g.position.set(tigerX(t), t.y, t.z);
      t.m.legs.forEach((l, i) => { l.rotation.x = Math.sin(worldT * 14 + i) * .4; });
      t.m.claws.forEach(c => { c.c.rotation.z = c.s * (.2 + Math.abs(Math.sin(worldT * 4)) * .4); });
      t.m.head.position.y = .95 + Math.abs(Math.sin(worldT * 7)) * .04;

    }
    const vx = Math.cos(worldT * t.spd + t.ph);
    t.m.g.position.set(tigerX(t), t.y, t.z); t.m.g.rotation.y = vx >= 0 ? 0 : Math.PI;
    const w = Math.sin(worldT * 7) * .5 * Math.min(1, Math.abs(vx) * 2);
    t.m.legs.forEach((l, i) => { l.rotation.z = (i % 2 ? w : -w) * (i < 2 ? 1 : -1); });
    t.m.head.rotation.set(Math.sin(worldT * 2) * .06, -t.m.g.rotation.y, 0);   // keep the face toward the player
    t.m.head.position.y = 1.75 + Math.abs(Math.sin(worldT * 7)) * .05;
  }
  for (const a of JW.anim) {
    if (a.kind === 'monkey') { a.m.armL.rotation.z = .25 + Math.sin(tAnim * 5 + a.ph) * .6; a.m.g.position.y = a.y + Math.abs(Math.sin(tAnim * 2 + a.ph)) * .15; }
    else if (a.kind === 'arrow') a.m.material.opacity = .6 + Math.sin(tAnim * 5) * .3;
    else if (a.kind === 'turtle') a.fl.forEach(f => { f.f.rotation.y = Math.sin(tAnim * 3 + a.ph + f.sz) * .5 * f.sx; });
    else if (a.kind === 'tail') a.m.rotation.x = Math.sin(tAnim * 1.5 + a.ph) * .3;
    else if (a.kind === 'flag') a.m.rotation.y = Math.sin(tAnim * 3) * .25;
    else if (a.kind === 'wave') a.m.position.y = a.y + Math.sin(tAnim * 1.6 + a.ph) * .12;
    else if (a.kind === 'urchin') { a.m.position.y = a.y + Math.sin(tAnim * 2.2 + a.ph) * .15; a.inner.rotation.y = tAnim * .6 + a.ph; a.m.rotation.y = Math.sin(tAnim * 1.3 + a.ph) * .25; }
    else if (a.kind === 'bob') { a.m.position.y = a.y + Math.sin(tAnim * 1.2 + a.ph) * a.a; a.m.rotation.z = Math.sin(tAnim * .9 + a.ph) * .05; }
    else if (a.kind === 'dolphin') {
      const ph = (worldT + a.ph) % 6;
      a.m.visible = ph < 1.6;
      if (a.m.visible) { const t = ph / 1.6; a.m.position.set(a.x + a.dir * (t - .5) * 9, a.y + Math.sin(Math.PI * t) * 4, a.z); a.m.rotation.set(0, a.dir > 0 ? 0 : Math.PI, (.5 - t) * 2.2); }
    }
  }
  const f = JW.flies, arr = f.geo.attributes.position.array;
  f.base.forEach((b, i) => {
    if (b.z > ball.z + 8) b.z -= 44; else if (b.z < ball.z - 36) b.z += 44;
    if (b.x > ball.x + 15) b.x -= 30; else if (b.x < ball.x - 15) b.x += 30;
    arr[i * 3] = b.x + Math.sin(tAnim * .7 + b.ph) * .6;
    arr[i * 3 + 1] = lastGroundY + b.y + Math.sin(tAnim * 1.1 + b.ph * 2) * .4;
    arr[i * 3 + 2] = b.z + Math.cos(tAnim * .5 + b.ph) * .6;
  });
  f.geo.attributes.position.needsUpdate = true;
}

function updateScene(dt) {
  tAnim += dt;
  if (state !== 'pause') worldT += dt;
  const targetBig = fxState.big > 0 ? 1.6 : 1;
  bigScale += (targetBig - bigScale) * (1 - Math.exp(-dt * 6));
  ballMesh.scale.setScalar(bigScale);
  ballMesh.position.set(ball.x, ball.y + (bigScale - 1) * R, ball.z);
  board.visible = !!surf;
  if (surf) { board.position.set(ball.x, ball.y - R - .05, ball.z); board.rotation.set(surfAir ? .25 : 0, 0, -ball.vx * .04); }

  for (const s of STARS) {
    if (s.got) {
      if (s.t > .5) continue;
      s.t += dt;
      s.mesh.position.y = s.y + s.t * 4; s.mesh.scale.setScalar(Math.max(0, 1.3 - s.t * 2.6));
      s.mesh.rotation.y += dt * 18;
      if (s.t > .5) s.mesh.visible = false;
      continue;
    }
    // stars the ball has passed sit between ball and camera; hide them so they do not block the view
    s.mesh.visible = state === 'title' || s.z < ball.z + 2.5;
    s.mesh.rotation.y = worldT * 2 + s.ph;
    s.mesh.position.y = s.y + (REDUCED ? 0 : Math.sin(worldT * 3 + s.ph) * .15);
  }
  for (const b of BOBBERS) b.g.position.y = b.y + Math.sin(worldT * .5 + b.ph) * .8;
  if (state !== 'pause') updateSky(dt);
  if (JW) updateJungle(dt);

  const k = 1 - Math.exp(-dt * 5);
  if (state === 'title') {
    for (const p of P) if (p.mv) { p.x = p.bx + Math.sin(worldT * p.mv.spd + p.mv.ph) * p.mv.amp; p.mesh.position.x = p.x; }
    if ($('#cropOv').hidden) ballMesh.quaternion.setFromEuler(new THREE.Euler(0, REDUCED ? 0 : Math.sin(tAnim * .6) * .5, 0));
    else ballMesh.quaternion.identity();
    const gy = lastGroundY + R;
    ball.y = gy + (REDUCED ? 0 : Math.abs(Math.sin(tAnim * 2.4)) * .35);
    camY = gy;
    const fr = titleFrame();
    if (fr) {
      // look straight at the ball from a distance that gives it the wanted size, then slide the view so it sits in the gap
      const d = R * (fr.H / 2) / (Math.tan(camera.fov * Math.PI / 360) * fr.rad);
      camera.setViewOffset(fr.W, fr.H, 0, fr.H / 2 - fr.yc, fr.W, fr.H);
      tmpV.set(ball.x + d * .12, gy + .35 + d * .16, ball.z + d);
      camPos.lerp(tmpV, k);
      camLook.lerp(tmpV.set(ball.x, gy + .35 + d * .02, ball.z), k);
    } else {
      if (camera.view && camera.view.enabled) camera.clearViewOffset();
      tmpV.set(ball.x + 1.2, gy + .9, ball.z + 7);
      camPos.lerp(tmpV, k);
      camLook.lerp(tmpV.set(ball.x, gy - 2.4, ball.z), k);
    }
  } else {
    if (camera.view && camera.view.enabled) camera.clearViewOffset();
    const above = ball.y - (lastGroundY + R);
    const fy = lastGroundY + R + (above > 0 ? (above < 3 ? above * .5 : 1.5 + (above - 3)) : Math.max(above, -2.5));   // big launches pull the camera up with the ball
    camY += (fy - camY) * (1 - Math.exp(-dt * 6));
    const back = 8.6 + (bigScale - 1) * 3;
    tmpV.set(ball.x * .85, camY + 3.9 + (bigScale - 1) * 2, ball.z + back);
    camPos.lerp(tmpV, k);
    camLook.lerp(tmpV.set(ball.x * .9, camY - .1 + Math.max(0, above - 3) * .25, ball.z - 6), k);
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  sun.position.set(ball.x + 6, lastGroundY + 16, ball.z + 4);
  sun.target.position.set(ball.x, lastGroundY, ball.z - 3);
}

// the free band between the title logo and the menu card, in canvas pixels (null when the title card is not showing)
function titleFrame() {
  const ov = $('#titleOv'); if (ov.hidden) return null;
  const W = cvs.clientWidth, H = cvs.clientHeight, top = $('#titleOv .brand').getBoundingClientRect().bottom, bot = $('#titleOv .card').getBoundingClientRect().top, cv = cvs.getBoundingClientRect();
  const band = bot - top;
  if (band < 44) return null;
  return { W, H, yc: (top + bot) / 2 - cv.top, rad: Math.max(20, Math.min(110, band * .42)) };
}
function resize() {
  const w = cvs.clientWidth, h = cvs.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 62 : 52;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let lastHud = '';
let lastBossHud = null;
function updateHud() {
  const s = `${collected}/${STARS.length}`, t = fmt(timer);
  let it = '';
  if (fxState.magnet > 0) it = `マグネット ${Math.ceil(fxState.magnet)}`;
  else if (fxState.wing > 0) it = `ハネ ${Math.ceil(fxState.wing)}`;
  else if (fxState.big > 0) it = `ビッグ ${Math.ceil(fxState.big)}`;
  if (fxState.cloud) it = it ? it + '・たすけ雲' : 'たすけ雲';
  const key = s + t + it;
  if (key !== lastHud) {
    $('#hudStars').textContent = s; $('#hudTime').textContent = t;
    const el = $('#hudItem'); el.hidden = !it; el.textContent = it;
    lastHud = key;
  }
  const showB = !!BOSS && !BOSS.down && ball.z < BOSS.z0 + 8, bk = showB ? BOSS.hp : -1;
  if (bk !== lastBossHud) {
    const hb = $('#hudBoss'); hb.hidden = !showB;
    if (showB) hb.innerHTML = `海賊船 <b>${'♥'.repeat(BOSS.hp)}</b><i>${'♥'.repeat(BOSS.maxHp - BOSS.hp)}</i>`;
    lastBossHud = bk;
  }
  const pr = Math.max(0, Math.min(1, (startZ - ball.z) / (startZ - goalZ))) * 100;
  $('#progFill').style.width = pr + '%'; $('#progBall').style.left = pr + '%';
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state === 'play') { step(dt / 2); step(dt / 2); }
  updateScene(dt);
  if (state !== 'title') updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
let toastTimer = 0;
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg; el.classList.remove('off');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('off'), ms);
}
function setMode(m) {
  mode = m;
  $('#btnCalib').hidden = m !== 'tilt';
  $('#modeLabel').textContent = m === 'tilt' ? '傾き操作' : 'タッチ操作';
}
function syncSegs() {
  const cur = { stage, level, speed };
  $$('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === cur[seg.dataset.opt]))));
}
function placeTitleCam() { camPos.set(ball.x + 1.2, R + .9, ball.z + 7); camLook.set(ball.x, R - 2.4, ball.z); }
function rebuild() { buildWorld(); resetRun(); placeTitleCam(); }
$$('.seg').forEach(seg => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v, opt = seg.dataset.opt;
  if (opt === 'level' && v !== level) { level = v; store.set('fc3-level', v); rebuild(); }
  else if (opt === 'stage' && v !== stage) { stage = v; store.set('fc3-stage', v); rebuild(); }
  else if (opt === 'speed') { speed = v; store.set('fc3-speed', v); }
  syncSegs();
}));

function updateStagePick() {
  const th = THEMES[stage];
  $('#stageName').textContent = `${STAGE_ORDER.indexOf(stage) + 1} ${th.name}`;
  $('#stageSwatch').style.background = th.swatch;
}
function renderStageList() {
  const list = $('#stageList');
  list.textContent = '';
  STAGE_ORDER.forEach((id, i) => {
    const th = THEMES[id], b = document.createElement('button');
    const best = (lv) => { const v = parseFloat(store.get(`fc3-best-${id}-${lv}`)); return isNaN(v) ? '—' : fmt(v); };
    b.type = 'button'; b.className = 'stage-card'; b.setAttribute('aria-pressed', String(id === stage));
    b.innerHTML = '<span class="stage-swatch"></span><span class="stage-text"><span class="no"></span><span class="nm"></span><span class="ds"></span><span class="bt"></span></span>';
    b.querySelector('.stage-swatch').style.background = th.swatch;
    b.querySelector('.no').textContent = `STAGE ${i + 1}`;
    b.querySelector('.nm').textContent = th.name;
    b.querySelector('.ds').textContent = th.desc;
    b.querySelector('.bt').textContent = `ベスト　かんたん ${best('easy')} ／ ふつう ${best('normal')}`;
    b.addEventListener('click', () => { if (id !== stage) { stage = id; store.set('fc3-stage', id); rebuild(); } closeStage(); });
    list.appendChild(b);
  });
}
function openStage() { renderStageList(); $('#titleOv').hidden = true; $('#stageOv').hidden = false; $('#stageList button[aria-pressed="true"]').focus(); }
function closeStage() { $('#stageOv').hidden = true; $('#titleOv').hidden = false; updateStagePick(); }
function showPlayUI(on) { $('#hud').hidden = !on; $('#controls').hidden = !on; }
function beginPlay() {
  $('#titleOv').hidden = true; $('#clearOv').hidden = true; showPlayUI(true);
  resetRun();
  state = 'play';
  toast(`${THEMES[stage].name}　スタート！`, 2400);
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}
}
function pause() {
  if (state !== 'play') return;
  state = 'pause'; joy = null; joyEl.hidden = true; keys.clear();
  $('#pauseOv').hidden = false; $('#btnResume').focus();
}
function resume() { $('#pauseOv').hidden = true; state = 'play'; if (mode === 'tilt') needCalib = true; }
function goHome() {
  $('#pauseOv').hidden = true; $('#clearOv').hidden = true; showPlayUI(false);
  state = 'title'; resetRun(); $('#titleOv').hidden = false;
}

$('#btnTilt').addEventListener('click', async () => {
  const btn = $('#btnTilt');
  btn.disabled = true; btn.textContent = 'センサーを確認中…';
  const ok = await enableTilt();
  btn.disabled = false; btn.textContent = '傾きであそぶ';
  if (ok) { needCalib = true; setMode('tilt'); beginPlay(); }
  else { setMode('touch'); beginPlay(); toast('この環境では傾きセンサーが使えないため、タッチ操作に切り替えました', 4000); }
});
$('#btnTouch').addEventListener('click', () => { setMode('touch'); beginPlay(); });
$('#btnStage').addEventListener('click', openStage);
$('#btnStageBack').addEventListener('click', closeStage);
$('#fileInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) openCrop(f); e.target.value = ''; });
$('#btnResetPhoto').addEventListener('click', () => { buildFace(null); store.del('fc3-face'); toast('元の顔にもどしました'); });
$('#btnCalib').addEventListener('click', calibrate);
$$('#btnSound, #btnSound2').forEach(b => b.addEventListener('click', () => {
  soundOn = !soundOn; store.set('fc-sound', soundOn ? 'on' : 'off'); updateSoundBtn();
  if (soundOn) { initAudio(); tone(1319, { dur: .25, type: 'triangle', vol: .3 }); }
}));
$('#btnJump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
$('#btnJump').addEventListener('keydown', (e) => { if (e.key === 'Enter') jump(); });
$('#btnMenu').addEventListener('click', pause);
$('#btnResume').addEventListener('click', resume);
$('#btnRestart').addEventListener('click', () => { $('#pauseOv').hidden = true; resetRun(); state = 'play'; });
$('#btnHome').addEventListener('click', goHome);
$('#btnHome2').addEventListener('click', goHome);
$('#btnRetry').addEventListener('click', () => { $('#clearOv').hidden = true; resetRun(); state = 'play'; });
$('#btnNext').addEventListener('click', () => {
  const next = STAGE_ORDER[STAGE_ORDER.indexOf(stage) + 1];
  if (!next) return;
  stage = next; store.set('fc3-stage', next); syncSegs(); updateStagePick();
  buildWorld(); beginPlay(); placeTitleCam();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- boot ---------- */
buildFace(null);
{ const d = store.get('fc3-face'); if (d) drawFaceFromURL(d); }
updateSoundBtn();
syncSegs();
updateStagePick();
setMode('touch');
buildWorld();
resetRun();
placeTitleCam();
resize();
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body></html>
